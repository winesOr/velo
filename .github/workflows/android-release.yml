name: Android Release
run-name: Android release ${{ inputs.release_tag }}

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Unique tag matching pubspec, preferably v<version>+<build>
        required: true
        type: string
      publish:
        description: Publish a stable Release immediately (false creates a draft)
        # TODO(VELO-UPDATE-RELEASE-001): Confirm whether future releases should default to drafts.
        default: true
        type: boolean

permissions: {}

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  validate-trusted-ref:
    # A repository trusts its own main branch; release secrets remain repository-scoped.
    runs-on: ubuntu-latest
    steps:
      - name: Require the protected main branch
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Android releases may only run from refs/heads/main." >&2
            exit 1
          fi

  build:
    needs: validate-trusted-ref
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate release tag and existing tag target
        shell: bash
        run: |
          python3 scripts/release/generate_android_update.py --tag "$RELEASE_TAG" --validate-only
          refs=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${RELEASE_TAG}" "refs/tags/${RELEASE_TAG}^{}")
          if [[ -n "$refs" ]]; then
            target=$(printf '%s\n' "$refs" | tail -1 | cut -f1)
            if [[ "$target" != "$GITHUB_SHA" ]]; then
              echo "The existing release tag points to a different commit." >&2
              exit 1
            fi
          fi
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: "3.47.1"
          cache: false
          pub-cache: false
      - name: Install dependencies
        run: flutter pub get --enforce-lockfile --no-example
      - name: Configure required release signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_SIGNING_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
        run: python3 scripts/release/configure_android_signing.py
      - name: Build universal release APK
        env:
          VELO_ANDROID_GITHUB_UPDATE_BUILD: "true"
        run: flutter build apk --release --dart-define=ENABLE_UPDATE_CHECK=true
      - name: Remove signing material
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties
      - name: Verify signing and generate update assets
        shell: bash
        env:
          ANDROID_SIGNING_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -n "$apksigner"
          "$apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/velo-apk-signing.txt"
          if grep -Fq 'CN=Android Debug' "$RUNNER_TEMP/velo-apk-signing.txt"; then
            echo "Refusing to publish a debug-signed APK." >&2
            exit 1
          fi
          python3 scripts/release/generate_android_update.py --tag "$RELEASE_TAG" --apk "$apk" --apkanalyzer "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          max_build=$(python3 scripts/release/android_release_state.py --repository "$GITHUB_REPOSITORY")
          origin_main_sha=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)
          test -n "$origin_main_sha"
          python3 scripts/release/validate_android_release.py \
            --candidate-manifest build/android-release/velo-update.json \
            --latest-build "$max_build" \
            --github-sha "$GITHUB_SHA" \
            --origin-main-sha "$origin_main_sha" \
            --apksigner-output "$RUNNER_TEMP/velo-apk-signing.txt" \
            --expected-cert-sha256 "$ANDROID_SIGNING_CERT_SHA256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-release
          path: |
            build/android-release/velo-android-universal.apk
            build/android-release/velo-update.json
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      PUBLISH_RELEASE: ${{ inputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: android-release
          path: release
      - name: Create a new release without replacing existing assets
        shell: bash
        run: |
          origin_main_sha=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)
          test -n "$origin_main_sha"
          max_build=$(python3 scripts/release/android_release_state.py --repository "$GITHUB_REPOSITORY")
          python3 scripts/release/validate_android_release.py \
            --candidate-manifest release/velo-update.json \
            --latest-build "$max_build" \
            --github-sha "$GITHUB_SHA" \
            --origin-main-sha "$origin_main_sha"
          # Recheck immediately before creating the Release: an existing tag is never moved.
          refs=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${RELEASE_TAG}" "refs/tags/${RELEASE_TAG}^{}")
          if [[ -n "$refs" ]]; then
            target=$(printf '%s\n' "$refs" | tail -1 | cut -f1)
            if [[ "$target" != "$GITHUB_SHA" ]]; then
              echo "The existing release tag points to a different commit." >&2
              exit 1
            fi
          fi
          args=(--repo "$GH_REPO" --target "$GITHUB_SHA" --title "Velo $RELEASE_TAG" --generate-notes)
          if [[ "$PUBLISH_RELEASE" == "true" ]]; then
            args+=(--latest)
          else
            args+=(--draft)
          fi
          gh release create "$RELEASE_TAG" release/velo-android-universal.apk release/velo-update.json "${args[@]}"
