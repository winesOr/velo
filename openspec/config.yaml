schema: spec-driven

context: |
  Language: zh-CN
  All artifacts must be written in zh-CN.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  Project: Plezy Flutter fork; Plex/Jellyfin/Emby; provider + ChangeNotifier;
  Drift/SharedPreferences; mono_theme; lib/focus for TV; slang for all UI strings.
  Source of constraints: CLAUDE.md (latest decisions), design/prototype HTML/JS,
  reference/docs/三端融合方案-Plezy基座-Yamby弹幕热力-VidHub视觉.md (read-only history).
  Latest prototype HTML takes precedence over stale preview PNGs for layout.
  Existing danmaku, ambient backdrop, glass HUD, Watch Together and companion
  remote must be extended rather than recreated. Never edit generated Dart files.
  Danmaku source list starts empty; no built-in URL or third-party credentials.
  Heatmap uses our own bucket/P95 algorithm and the existing timeline painter.
  Keep mpv/ExoPlayer defaults; VLC is an optional future third backend.
  reference/ is read-only. Preserve unrelated working-tree changes.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
